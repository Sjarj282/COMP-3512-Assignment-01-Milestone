<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 1 - Milestone</title>
  <style>

    body {
      margin: 0;
    }

    .body-container{
        background-color: rgb(245, 237, 237);
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: 1fr 3fr 1fr;
        min-height: 100vh;
    }
    .nav-bar {
      display: flex;
      padding: 1rem 2rem;
      border: 2px solid black;
      padding-bottom: 30px;
      padding-top: 20px;
      grid-column: 1 / -1;
    }

    .nav-bar h1 {
      margin: 0;
      color: #050505;
    }

    .navbar {
      margin-left: 50rem;
      font-size: 20px;
      margin-top: 6px;
    }

    .navbar ul {
      display: flex;
      gap: 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .navbar a {
      color: #070707;
      text-decoration: none;
      font-weight: bold;
    }

    .navbar li.cart {
      margin-left: 40rem;
    }

    .main-product-container{
        background-color: rgb(226, 223, 223);
        width: 100%;
        grid-column: 2 / 3;
        box-sizing: border-box;
    }

     .main-product-container h2{
        padding-left: 20px;

    }

    .product-card{
        display: flex;
        flex-direction: column;
      width: 160px;
        box-sizing: border-box;
      padding: 0;
        margin-left: 20px;
      overflow: visible;
    }

    .product-card img {
        width: 100%;
        height: auto;
        display: block;
      border: 2px solid #4f6f8f;
    }

    .product-card p {
      margin: 0;
        word-break: break-word;
    }

    .product-img {
      cursor: pointer;
    }

    .display-product-info{
      background-color: #9aa3ad;
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      color: white;
      border: 2px solid #8ab7de;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .product-grid {
        display: grid;
        margin-left: 45px;
      grid-template-columns: repeat(auto-fill, 160px);
        gap: 16px;
    }

    .product-footer {
        display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .product-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: #222;
      font-weight: bold;
      line-height: 1.1;
    }

    footer {
      grid-column: 1 / -1;
    }



  </style>
</head>
<body class="body-container">

  <!-- 1. Header Section -->
  <header class="nav-bar">
    <h1>Logo</h1>

    <nav class="navbar">
        <ul>
            <li><a href="#">Home </a></li>
            <li><a href="#">Browse </a></li>
            <li><a href="#">About</a></li>
            <li class="cart"><a href="#">Cart</a></li>
        </ul>
    </nav>
  </header>
  

  <!-- 3. Primary Content Area -->
  <main class="main-product-container">
    <h2>Browse</h2>
    <div class="product-grid">
    </div>
    
  </main>

  <!-- 5. Footer Section -->
  <footer>
    <p>&copy; 2026 Your Company Name</p>
  </footer>
  <script type="module" src="script.js"></script>

</body>
</html>
